'section: workflows':
  - changed-files:
      - any-glob-to-any-file:
          - '.github/workflows/**'
          - '.github/scripts/**'
'section: repo':
  - changed-files:
      - any-glob-to-any-file:
          - '*'
'section: tests':
  - changed-files:
      - any-glob-to-any-file:
          - 'test/**'
'experience: developer':
  - changed-files:
      - any-glob-to-any-file:
          - '.editorconfig'
          - '.gitignore'
          - '.prettierrc'
          - '.prettierignore'
          - '.release-it.json'
          - '.vscodeignore'
          - '.vscode/**'
          - 'eslint.config.mjs'
          - '.githooks/**'
          - 'scripts/**'
'experience: visual':
  - changed-files:
      - any-glob-to-any-file:
          - 'themes/**'
          - 'images/**'
          - 'public/**'
'context: github':
  - changed-files:
      - any-glob-to-any-file:
          - '.github/**'
'context: npm':
  - changed-files:
      - any-glob-to-any-file:
          - 'package.json'
          - 'package-lock.json'
'mindless: ✏️ docs':
  - any:
      - head-branch: ['^docs/']
      - changed-files:
          - any-glob-to-any-file:
              - '**/*.md'
'mindless: 📦 dependencies':
  - changed-files:
      - any-glob-to-any-file:
          - 'package-lock.json'

# By branch prefix only, so docs/fix-something is not labelled a bug
'✨ feature':
  - head-branch: ['^feat/']
'problems: 🐛 bug':
  - head-branch: ['^fix/']
'mindless: 🤖 chore':
  - head-branch: ['^chore/']
'improvements: 💡 enhancement':
  - head-branch: ['^improvements/']
