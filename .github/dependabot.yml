version: 2
updates:
  - package-ecosystem: 'npm'
    directory: '/'
    # Minor and patch updates are grouped into one PR a week. Majors are not,
    # so each one gets its own PR to test and merge, and one blocked major does
    # not hold back the others
    groups:
      minor-and-patch:
        applies-to: version-updates
        update-types:
          - 'minor'
          - 'patch'
    schedule:
      interval: 'weekly'
    # Only propose versions published at least two weeks ago: a compromised
    # release is usually caught and pulled within days. Security updates are
    # not delayed
    cooldown:
      default-days: 14
    labels:
      - 'mindless: 📦 dependencies'
    commit-message:
      prefix: 'chore: 🤖 '
    # One minor-and-patch group plus room for separate majors
    open-pull-requests-limit: 5
    allow:
      - dependency-type: direct

  # Actions are pinned to commit SHAs; this keeps the pins and their version
  # comments up to date
  - package-ecosystem: 'github-actions'
    directory: '/'
    groups:
      minor-and-patch:
        applies-to: version-updates
        update-types:
          - 'minor'
          - 'patch'
    schedule:
      interval: 'weekly'
    # Same two-week delay as for npm, for the same reason
    cooldown:
      default-days: 14
    labels:
      - 'mindless: 📦 dependencies'
    commit-message:
      prefix: 'ci: 🎡 '
