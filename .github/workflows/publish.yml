name: Publish

on:
  # Release when a push to main changes what gets published, or how. The
  # release guard then decides whether there is anything to release. A push,
  # not a merged pull_request event: the marketplace environment only allows
  # main, and a pull_request run is on the PR's merge ref
  push:
    branches: ['main']
    paths:
      - 'themes/**'
      - 'package.json'
      - 'package-lock.json'
      - 'README.md'
      - 'LICENSE'
      - '.vscodeignore'
      - '.release-it.json'
      - 'scripts/**'
      - '.github/scripts/should-release.sh'
      - '.github/workflows/publish.yml'
  workflow_dispatch:

# Read-only by default; only the publish job gets an OIDC token
permissions:
  contents: read

# One release at a time; never cancel a release halfway
concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  publish:
    # Manual runs too must be on main, which the environment requires anyway
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    # Named in the Marketplace and Open VSX trusted publishing policies, and
    # deployable from main only
    environment: marketplace
    permissions:
      contents: read # Release commits, tags and GitHub releases use GH_TOKEN
      id-token: write # Trusted publishing (OIDC) and signing the attestation
      attestations: write # The build provenance attestation of the .vsix
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # The release guard and release-it read tags and commits
          token: ${{ secrets.GH_TOKEN }}
      - name: Setup Node.js environment # No dependency cache in a publishing job
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - name: Install dependencies
        run: npm ci
      - name: Check for changes to release
        id: guard
        run: .github/scripts/should-release.sh
      - name: Audit dependencies # The .vsix ships none; this keeps the gate if that changes
        if: steps.guard.outputs.release == 'true'
        run: npm audit --omit=dev --audit-level=high
      - name: Release
        # release-it bumps the version and writes the changelog, packages and
        # checks the .vsix (before:release), publishes it to the Marketplace
        # and Open VSX (before:git:release), then pushes the release commit and
        # tag and creates the GitHub release with the .vsix attached.
        # --verbose puts the hooks' output (vsce, ovsx, check:pack) in the log
        if: steps.guard.outputs.release == 'true'
        run: |
          git config user.name "$ACTOR"
          git config user.email "$ACTOR@users.noreply.github.com"
          npm run release -- --verbose
        env:
          ACTOR: ${{ github.actor }} # via env, never interpolated into the script
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
          # Set to true once Open VSX trusted publishing is registered
          OPENVSX_PUBLISH: ${{ vars.OPENVSX_PUBLISH }}
      - name: Attest the published .vsix
        # Sigstore-signed build provenance for the same file release-it
        # published; verify with gh attestation verify (see SECURITY.md)
        if: steps.guard.outputs.release == 'true'
        id: attest
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: vscode-accessible-theme.vsix
      - name: Attach the attestation to the GitHub release
        if: steps.guard.outputs.release == 'true'
        run: |
          version="$(node -p "require('./package.json').version")"
          cp "$BUNDLE" vscode-accessible-theme.vsix.sigstore.json
          gh release upload "$version" vscode-accessible-theme.vsix.sigstore.json
        env:
          BUNDLE: ${{ steps.attest.outputs.bundle-path }}
          GH_TOKEN: ${{ secrets.GH_TOKEN }}

  notify:
    name: Notify failed build
    needs: publish
    if: failure()
    runs-on: ubuntu-24.04
    # GITHUB_TOKEN is enough to open an issue; GH_TOKEN is for the release only
    permissions:
      issues: write
    steps:
      - uses: drivendataorg/failed-build-issue-action@940568ce50eeef3f31a920614cefcc6102d2f930 # v1.3.0
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          label-name: 'problems: 💔 build failed'
          create-label: false
