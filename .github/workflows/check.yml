name: Checks

on:
  # Every pull request, with no path filter: check is a required check, and a
  # PR it skipped could never merge
  pull_request:
    branches: ['main']
  # Pushes to main only when something the job checks changed
  push:
    branches: ['main']
    paths:
      - '.github/**'
      - '.githooks/**'
      - 'themes/**'
      - '**/*.md'
      - '**/*.json'
      - '**/*.yml'
      - 'eslint.config.mjs'
      - '.prettierrc'
      - '.prettierignore'
      - '.vscodeignore'
      - 'scripts/**'
      - 'test/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Setup Node.js environment
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - name: Install dependencies
        run: npm ci
      - name: Lint # Code and Markdown, with Prettier
        run: npm run style:lint
      - name: Check the format of JSON and YAML files # Also fails on invalid theme JSON
        run: npm run style:format-check
      - name: Test # WCAG AA contrast of every syntax colour in both themes
        run: npm test
      - name: Package the extension
        run: npm run package
      - name: Check the package # Exact file list, manifest, themes, README images
        run: npm run check:pack

  notify:
    name: Notify failed check
    needs: check
    if: failure()
    runs-on: ubuntu-24.04
    # GITHUB_TOKEN, not GH_TOKEN: secrets are empty on Dependabot pull requests
    permissions:
      issues: write
    steps:
      - uses: drivendataorg/failed-build-issue-action@940568ce50eeef3f31a920614cefcc6102d2f930 # v1.3.0
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          label-name: 'problems: 💔 build failed'
          create-label: false
